<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RobotDynamics</title>
<meta name="description" content="Rigid-body dynamics that fits on a microcontroller — 装得进单片机的刚体动力学">
<style>
    :root {
        --fg:      #23272e;
        --dim:     #6b7480;
        --accent:  #2b6cb0;
        --bg:      #ffffff;
        --line:    #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
        :root { --fg: #e3e7ec; --dim: #98a2b0; --accent: #7ba7d4;
                --bg: #1b2836; --line: #2f5177; }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
              "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { padding: 2rem; max-width: 32rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .4rem; letter-spacing: -0.01em; }
    p.tagline { margin: 0 0 2.2rem; color: var(--dim); }
    .choices { display: flex; gap: 1rem; justify-content: center;
               flex-wrap: wrap; }
    a.choice {
        display: block; min-width: 11rem; padding: 1rem 1.4rem;
        border: 1px solid var(--line); border-radius: 10px;
        color: inherit; text-decoration: none;
        transition: border-color .15s, transform .15s;
    }
    a.choice:hover { border-color: var(--accent); transform: translateY(-2px); }
    a.choice strong { display: block; font-size: 1.1rem; color: var(--accent); }
    a.choice span { display: block; font-size: .85rem; color: var(--dim);
                    margin-top: .25rem; }
    p.repo { margin-top: 2.4rem; font-size: .85rem; }
    p.repo a { color: var(--accent); }
</style>
</head>
<body>
<main>
    <h1>RobotDynamics</h1>
    <p class="tagline">Rigid-body dynamics that fits on a microcontroller<br>
       装得进单片机的刚体动力学</p>
    <div class="choices">
        <a class="choice" href="en/"><strong>English</strong>
            <span>Guides and API reference</span></a>
        <a class="choice" href="zh/"><strong>中文</strong>
            <span>使用指南与 API 参考</span></a>
    </div>
    <p class="repo"><a href="https://github.com/YueWang996/robot-dynamics-c">GitHub</a></p>
</main>
<script>
/* Send a first-time visitor to the language their browser asks for, and stop
 * doing it once they have chosen, so that picking the other one from this page
 * is not undone the next time they open the site. */
(function () {
    "use strict";
    var KEY = "rd-docs-language", chosen = null;
    try { chosen = localStorage.getItem(KEY); } catch (e) { /* private mode */ }

    document.querySelectorAll("a.choice").forEach(function (a) {
        a.addEventListener("click", function () {
            try { localStorage.setItem(KEY, a.getAttribute("href")
                                            .replace("/", "")); } catch (e) {}
        });
    });

    if (chosen === "en" || chosen === "zh") {
        location.replace(chosen + "/");
        return;
    }
    var wanted = (navigator.language || "en").toLowerCase();
    location.replace(wanted.indexOf("zh") === 0 ? "zh/" : "en/");
})();
</script>
</body>
</html>
